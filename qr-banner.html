<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited · QR Banner</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --bg: #06070f; --ink: #eaf2ff; --muted: #9fb0c9; --blue: #6fb1ff; --hi: #dcedff; --lo: #4f8fe8; --line: rgba(96, 165, 250, .32); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; font-family: "Jost", "Segoe UI", sans-serif; font-weight: 300; color: var(--ink); overflow: hidden; }

  /* The banner fills the window; everything is sized in --u so it scales as one piece. */
  .banner {
    --u: min(1vw, 2.13vh);
    position: relative; width: calc(var(--u) * 100); height: calc(var(--u) * 46.9); overflow: hidden;
    display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: calc(var(--u) * 3);
    padding: 0 calc(var(--u) * 7);
    background:
      radial-gradient(ellipse 70% 90% at 100% 50%, rgba(79, 143, 232, .22), transparent 70%),
      radial-gradient(ellipse 60% 70% at 0% 110%, rgba(140, 90, 200, .16), transparent 70%),
      linear-gradient(135deg, #0a0d1f 0%, #06070f 55%, #0a1026 100%);
  }
  .banner::before {                                   /* thin inner frame */
    content: ""; position: absolute; inset: calc(var(--u) * 1.4); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.2); pointer-events: none;
  }
  svg.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .copy { position: relative; }
  .eyebrow { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.5); font-weight: 500; letter-spacing: .5em; text-transform: uppercase; color: var(--blue); }
  .eyebrow::before, .eyebrow::after { content: ""; height: 1px; width: calc(var(--u) * 4); background: linear-gradient(90deg, transparent, var(--blue)); }
  .eyebrow::after { transform: scaleX(-1); }
  .lead { margin-top: calc(var(--u) * 1.6); font-family: "Cormorant Garamond", serif; font-style: italic; font-size: calc(var(--u) * 1.9); color: var(--muted); }
  .name {
    font-family: "Pinyon Script", cursive; font-weight: 400; font-size: calc(var(--u) * 9.6); line-height: 1.1; padding: .08em .1em .14em 0; white-space: nowrap;
    background: linear-gradient(100deg, var(--lo) 0%, var(--blue) 25%, var(--hi) 50%, var(--blue) 72%, var(--lo) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: "Cormorant Garamond", serif; font-size: calc(var(--u) * 2.5); letter-spacing: .04em; }
  .facts { margin-top: calc(var(--u) * 2.2); display: flex; flex-wrap: wrap; gap: calc(var(--u) * .9) calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.32); letter-spacing: .26em; text-transform: uppercase; }
  .facts i { font-style: normal; color: var(--blue); }

  .qr { position: relative; justify-self: end; text-align: center; }
  .qr .card {
    width: calc(var(--u) * 24); padding: calc(var(--u) * 1.5); border-radius: calc(var(--u) * 1.8); background: #fff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .5), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(79, 143, 232, .45);
  }
  .qr svg { display: block; width: 100%; height: auto; }
  .qr .scan { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 1.3); font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: var(--hi); padding-left: .34em; }
  .qr .url { margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1.02); letter-spacing: .04em; color: var(--muted); }

  @media print {
    @page { size: landscape; margin: 0; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="banner" id="banner">
  <svg class="sky" id="sky" viewBox="0 0 1000 469" preserveAspectRatio="none" aria-hidden="true"></svg>

  <div class="copy">
    <div class="eyebrow">You are invited</div>
    <p class="lead">to celebrate the birthday of</p>
    <h1 class="name" id="name"></h1>
    <p class="sub">Scan the code to open your invitation</p>
    <div class="facts"><span id="date"></span><i>✦</i><span id="time"></span><i>✦</i><span id="venue"></span></div>
  </div>

  <div class="qr">
    <div class="card" id="qr" role="img" aria-label="QR code that opens the birthday invitation"></div>
    <div class="scan">Scan me</div>
    <div class="url" id="url"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============ EDIT THESE IF THE DETAILS CHANGE ============ */
const BANNER = {
  link: "https://mypersonalvibe.github.io/ryan-gomez-birthday/",   // what the QR code opens
  name: "Ryan Gomez",
  date: "November 22, 2026",
  time: "5:30 PM",
  venue: "Blue Box Music Restaurant"
};
/* ========================================================== */

document.getElementById("name").textContent = BANNER.name;
document.getElementById("date").textContent = BANNER.date;
document.getElementById("time").textContent = BANNER.time;
document.getElementById("venue").textContent = BANNER.venue;
document.getElementById("url").textContent = BANNER.link.replace(/^https?:\/\//, "").replace(/\/$/, "");

/* QR code: dark navy modules on white, error correction Q, with the standard 4-module quiet zone */
(function drawQR() {
  const qr = qrcode(0, "Q"); qr.addData(BANNER.link); qr.make();
  const n = qr.getModuleCount(), m = 4, size = n + m * 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  document.getElementById("qr").innerHTML =
    `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#0a1230"/></svg>`;
})();

/* static fireworks + stars behind the text (seeded so the banner looks the same every time) */
(function drawSky() {
  let seed = 22; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const bursts = [[70, 70, 46, "#6fb1ff"], [455, 415, 34, "#b8a4ff"], [545, 70, 52, "#dcedff"], [610, 400, 34, "#6fb1ff"], [930, 60, 38, "#8fd3ff"], [955, 420, 30, "#b8a4ff"]];
  let out = "";
  for (let i = 0; i < 110; i++) out += `<circle cx="${(rnd() * 1000).toFixed(1)}" cy="${(rnd() * 469).toFixed(1)}" r="${(rnd() * .9 + .25).toFixed(2)}" fill="#fff" opacity="${(rnd() * .5 + .15).toFixed(2)}"/>`;
  bursts.forEach(([x, y, R, col]) => {
    const rays = 26;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 + rnd() * .2, r1 = R * (.18 + rnd() * .12), r2 = R * (.75 + rnd() * .3);
      const x2 = x + Math.cos(a) * r2, y2 = y + Math.sin(a) * r2 + r2 * .06;
      out += `<line x1="${(x + Math.cos(a) * r1).toFixed(1)}" y1="${(y + Math.sin(a) * r1).toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width=".9" stroke-linecap="round" opacity="${(.22 + rnd() * .3).toFixed(2)}"/>`;
      out += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.1" fill="${col}" opacity=".6"/>`;
    }
  });
  document.getElementById("sky").innerHTML = out;
})();
</script>
</body>
</html>
